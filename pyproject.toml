[project]
name = "babanongchang"
version = "0.1.0"
description = "支付宝芭芭农场自动化脚本"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "onnxruntime>=1.20,<2",
    "opencv-python-headless>=4.10,<5",
    "rapidocr==3.10.0",
    "tomlkit>=0.15.2,<0.16",
]

[project.scripts]
babanongchang = "babanongchang.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babanongchang"]
